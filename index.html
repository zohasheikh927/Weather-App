 <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Weather App</h1>
        <p class="subtitle">Check the current weather of any city</p>

        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">Search</button>

        </div>

        <p id="message"></p>

        <div id="weatherCard" class="weather-card">

            <h2 id="cityName">City</h2>

            <div class="temperature">
                <span id="temperature">--</span>°C
            </div>

            <p id="condition">Weather condition</p>

            <div class="details">

                <div>
                    <h3>💧</h3>
                    <p>Humidity</p>
                    <span id="humidity">--</span>%
                </div>

                <div>
                    <h3>💨</h3>
                    <p>Wind Speed</p>
                    <span id="windSpeed">--</span> km/h
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
    
</body>
</html>
